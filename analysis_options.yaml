include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/**/*.g.dart
    - build/**
    # Pigeon contract is documentation only (the app ships MethodChannels); it needs the
    # `pigeon` codegen package which is not a build dependency.
    - pigeons/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    require_trailing_commas: false
